<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Wei Been — Software Engineer and Data Scientist</title>
  <desc id="desc">An illustrated dusk skyline with soft clouds and hills, inspired by a warm anime landscape.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0.7">
      <stop offset="0" stop-color="#10243e"/>
      <stop offset="0.50" stop-color="#244e73"/>
      <stop offset="0.79" stop-color="#4f84a2"/>
      <stop offset="1" stop-color="#df9c91"/>
    </linearGradient>
    <radialGradient id="sun-glow">
      <stop offset="0" stop-color="#ffeac3" stop-opacity=".66"/>
      <stop offset=".55" stop-color="#ffccaf" stop-opacity=".23"/>
      <stop offset="1" stop-color="#ffd8c3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far-ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6386a0"/>
      <stop offset="1" stop-color="#365e80"/>
    </linearGradient>
    <linearGradient id="near-ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e6170"/>
      <stop offset="1" stop-color="#173e56"/>
    </linearGradient>
    <clipPath id="rounded"><rect width="1200" height="340" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1200" height="340" fill="url(#sky)"/>
    <circle cx="1000" cy="120" r="210" fill="url(#sun-glow)"/>
    <circle cx="1000" cy="119" r="56" fill="#ffdfbc" opacity=".91"/>
    <circle cx="1000" cy="119" r="48" fill="#ffe7ca" opacity=".95"/>

    <g fill="#c8e7f4" opacity=".70">
      <circle cx="714" cy="68" r="2.1"/><circle cx="806" cy="40" r="1.6"/>
      <circle cx="882" cy="66" r="1.5"/><circle cx="1111" cy="42" r="1.8"/>
      <circle cx="1160" cy="92" r="1.1"/><circle cx="658" cy="111" r="1.4"/>
    </g>
    <g stroke="#d5ebf5" stroke-opacity=".65" stroke-width="1.5">
      <path d="M759 39v10m-5-5h10"/><path d="M1134 120v9m-4.5-4.5h9"/>
    </g>

    <!-- Hand-painted-looking clouds along the bright horizon. -->
    <g fill="#f7e2d7" opacity=".39">
      <ellipse cx="836" cy="107" rx="100" ry="17"/>
      <ellipse cx="792" cy="99" rx="45" ry="24"/>
      <ellipse cx="858" cy="96" rx="58" ry="29"/>
      <ellipse cx="920" cy="113" rx="67" ry="15"/>
      <ellipse cx="1103" cy="184" rx="85" ry="14"/>
      <ellipse cx="1074" cy="174" rx="37" ry="23"/>
      <ellipse cx="1143" cy="172" rx="48" ry="23"/>
    </g>
    <g fill="#d6e7f1" opacity=".18">
      <ellipse cx="719" cy="167" rx="97" ry="10"/>
      <ellipse cx="915" cy="207" rx="97" ry="8"/>
    </g>

    <!-- Distant mountain shapes / town roofs. -->
    <path d="M510 295 666 192 743 242 839 176 941 264 1047 205 1200 271v69H510z" fill="url(#far-ridge)" opacity=".85"/>
    <path d="M565 306 712 233 817 280 899 216 1008 281 1095 237 1200 286v54H565z" fill="#416c83" opacity=".72"/>
    <g fill="#284d67" opacity=".75">
      <path d="M866 296v-65h27v65zm31 0v-47h32v47zm40 0v-76h20v76zm27 0v-54h36v54z"/>
      <path d="M1055 298v-48h23v48zm29 0v-67h29v67zm38 0v-38h34v38z"/>
    </g>
    <g fill="#f0c7a7" opacity=".65">
      <rect x="874" y="251" width="4" height="5" rx="1"/><rect x="883" y="251" width="4" height="5" rx="1"/>
      <rect x="944" y="242" width="4" height="5" rx="1"/><rect x="944" y="258" width="4" height="5" rx="1"/>
      <rect x="1092" y="247" width="4" height="5" rx="1"/>
    </g>
    <path d="M570 340q98-94 201-64 62 18 126 19 60 0 136-47 89-51 167-28v120z" fill="url(#near-ridge)"/>
    <path d="M823 340q99-52 176-31 111 29 201-10v41z" fill="#15364d" opacity=".95"/>

    <!-- A restrained leafy silhouette in the foreground. -->
    <g fill="#102f46" opacity=".67">
      <path d="M1146 340q16-63 24-120h5q-14 81-18 120z"/>
      <ellipse cx="1166" cy="228" rx="20" ry="47" transform="rotate(45 1166 228)"/>
      <ellipse cx="1188" cy="249" rx="16" ry="41" transform="rotate(74 1188 249)"/>
      <ellipse cx="1136" cy="245" rx="13" ry="30" transform="rotate(-46 1136 245)"/>
    </g>

    <!-- Gentle dark overlay keeps typography legible at every width. -->
    <rect width="740" height="340" fill="#10243e" opacity=".23"/>
    <text x="70" y="74" fill="#a9d2e9" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="4">HELLO, WORLD</text>
    <text x="68" y="152" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="67" font-weight="700" letter-spacing="-2">Wei Been</text>
    <text x="71" y="196" fill="#e0eff9" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600">Software Engineer  /  Data Scientist</text>
    <path d="M71 220H340" stroke="#a8d7e9" stroke-width="2" opacity=".66"/>
    <text x="71" y="253" fill="#f1f6fc" font-family="Arial, Helvetica, sans-serif" font-size="20">From data to dependable AI systems.</text>
    <text x="71" y="303" fill="#9dc5d8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2.5">BUILD  ·  MEASURE  ·  IMPROVE</text>
  </g>
</svg>